name: Deploy to Catalyst

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies and Build
        run: |
          cd client
          npm ci
          npm run build
      
      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli@1.26.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bundle Backend Dependencies
        run: |
          pip install -t backend/.packages -r backend/requirements.txt
        
      - name: Deploy to Catalyst
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
          PROJECT_ID: "45958000000015001"
        run: |
          set -o pipefail
          rm -rf functions/ps_1_cis_function/pipeline_function
          cp -r pipeline_function functions/ps_1_cis_function/
          rm -rf functions/ps_1_cis_function/shared
          cp -r shared functions/ps_1_cis_function/

          # BUG FIX: zcatalyst-cli exits 0 even when the deploy does nothing --
          # an expired CATALYST_TOKEN prints "Error: Authentication failure" and
          # "No components deployed!" and the job still went green. Every run
          # since at least 2026-07-25 reported success while shipping nothing,
          # so the backend silently kept running old code and all real deploys
          # had to be done by hand. Inspect the output and fail explicitly.
          # BUG FIX: --dc is required here. This project lives in the India
          # data centre (api.catalyst.zoho.in) and CATALYST_TOKEN is issued by
          # it, but a fresh CLI in CI has no login config to tell it that --
          # locally it works only because `catalyst login` persists
          # "active_dc": "in". Without --dc the CLI presents an India token to
          # the default (US) endpoint and fails with "unable to refresh access
          # token" -> every component skipped, nothing deployed.
          npx zcatalyst-cli@1.26.2 deploy \
            --project $PROJECT_ID \
            --token $CATALYST_TOKEN \
            --dc in 2>&1 | tee deploy.log

          if grep -qiE "Authentication failure|No components deployed|deploy skipped" deploy.log; then
            echo "::error::Catalyst deploy FAILED (CLI exited 0 but nothing shipped). If this is an auth failure, regenerate the token with 'catalyst token:generate' and update the CATALYST_TOKEN repo secret."
            exit 1
          fi
          if ! grep -qi "DEPLOYMENT SUCCESSFUL" deploy.log; then
            echo "::error::Catalyst deploy produced no 'DEPLOYMENT SUCCESSFUL' confirmation -- treating as a failure."
            exit 1
          fi
