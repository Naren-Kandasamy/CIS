[pytest]
testpaths = tests

# Tests live in tests/ but import repo packages from the root
# (`from backend...`, `from shared...`, `from pipeline_function...`).
# Without this, pytest's default "prepend" import mode only puts tests/ on
# sys.path and every one of those imports fails. Requires pytest >= 7
# (backend/requirements.txt pins >= 8.3.3).
pythonpath = .
